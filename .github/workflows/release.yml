name: Release

# 三种触发方式：
#   1) 推 tag（v1.0.0）→ 自动打包 + 建 GitHub Release
#   2) Actions 页面手动点 Run workflow → 只打包，产物在本次 run 的 Artifacts 里
#   3) main 上手动触发同上
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 建 Release 需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BIN: audio-parse-gateway

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # 主力产物：glibc 动态链接，ubuntu/debian 直接跑
          - target: x86_64-unknown-linux-gnu
            experimental: false
            android: false
          # 静态链接：拷到任何 Linux（alpine 也行）都能跑
          - target: x86_64-unknown-linux-musl
            experimental: true
            android: false
          # ARM64 服务器（云厂商的 Ampere/Graviton 之类）
          - target: aarch64-unknown-linux-gnu
            experimental: true
            android: false
          # Android / Termux（arm64）：Termux 是 bionic libc，没有 glibc，
          # 只有 NDK 编出来的这个能直接跑
          - target: aarch64-linux-android
            experimental: true
            android: true

    # experimental 的目标挂了不会把整个 workflow 带红，也不会挡住 gnu 产物
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK (termux 专用产物)
        if: matrix.android
        run: |
          set -euo pipefail
          # pinned，避免 latest 被下架导致 workflow 红
          NDK_VERSION="r27c"
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          curl -fsSL --retry 3 -o "/tmp/${NDK_ZIP}" "https://dl.google.com/android/repository/${NDK_ZIP}"
          sudo mkdir -p /opt/android-ndk
          sudo unzip -q "/tmp/${NDK_ZIP}" -d /opt/android-ndk
          echo "ANDROID_NDK_HOME=/opt/android-ndk/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          ls "/opt/android-ndk/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" | head -5

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install aarch64 cross linker
        if: contains(matrix.target, 'aarch64') && !matrix.android
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Android NDK linker
        if: matrix.android
        run: |
          set -euo pipefail
          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          # ring / 任何 C 依赖都走 NDK clang
          echo "CC_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/llvm-ar" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1" >> "$GITHUB_ENV"

      - name: cargo build (release)
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # ring（rustls 的加密实现）要用 C 编译器，交叉编译时把 CC 指对
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package tarball
        run: |
          set -euo pipefail
          NAME="${BIN}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/${BIN}" "dist/${NAME}/"
          cp README.md "dist/${NAME}/"
          if [ "${{ matrix.android }}" = "true" ]; then
            # Termux 用户直接拷走就能用
            cp termux/install.sh termux/check.sh "dist/${NAME}/" 2>/dev/null || true
          fi
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (
            cd dist
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          )
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # tag 触发才有 Release；重复上传用 --clobber 覆盖
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 \
            --generate-notes --title "${GITHUB_REF_NAME}" \
          || gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 --clobber

      - name: Summary
        if: always()
        run: |
          echo "### ${BIN} ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(没有产物)" >> "$GITHUB_STEP_SUMMARY"
