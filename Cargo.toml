[package]
name = "audio-parse-gateway"
version = "0.1.12"
edition = "2021"
rust-version = "1.88"
description = "落雪音乐（LX Music）解析后端骨架：高并发、低延迟、多级缓存、singleflight 防击穿"
license = "MIT"
autobins = false


[[bin]]
name = "audio-parse-gateway"
path = "src/app.rs"

[dependencies]
# ---------- Web / 异步运行时 ----------
axum = { version = "0.8", features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["full"] }

# ---------- 上游 HTTP 客户端（全局连接池） ----------
# 用 rustls 而不是 native-tls，避免编译期依赖系统 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2", "stream"] }

# ---------- 缓存 ----------
moka = { version = "0.12", features = ["future"] }   # L1：无锁并发内存缓存
redis = { version = "1.8", features = ["tokio-comp", "connection-manager", "aio"] } # L2：异步连接池 / 自动重连

# ---------- 异步 trait：dyn Upstream 适配器注册表 ----------
async-trait = "0.1"

# ---------- 全局单例 / 并发容器 ----------
once_cell = "1"
dashmap = "6"

# ---------- 序列化 / 日志 / 错误 ----------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"

# ---------- 哈希：酷狗 v5 直链要 md5 签名 ----------
md5 = "0.7"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
